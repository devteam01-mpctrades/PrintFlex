# PRODUCTION config for the listed PrintFlex app. Push with: shopify app deploy --config production
# Dev uses shopify.app.toml (the separate PrintFlex Dev app). Keep scopes and webhooks identical in both.
# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

name = "PrintFlex"
handle = "printflex"
embedded = true
client_id = "34363db3a11f246c64f2b24864846aea"
application_url = "https://app.printflex.mpctrades.com"

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_orders,write_orders,read_products"

[webhooks]
api_version = "2026-07"

  [[webhooks.subscriptions]]
  topics = [ "app/uninstalled" ]
  uri = "/webhooks/app/uninstalled"

  [[webhooks.subscriptions]]
  topics = [ "app/scopes_update" ]
  uri = "/webhooks/app/scopes_update"

  [[webhooks.subscriptions]]
  topics = [ "orders/create", "orders/updated", "orders/fulfilled", "orders/cancelled" ]
  uri = "/webhooks/orders"

  [[webhooks.subscriptions]]
  compliance_topics = [ "customers/data_request", "customers/redact", "shop/redact" ]
  uri = "/webhooks/compliance"

[auth]
redirect_urls = [
  "https://app.printflex.mpctrades.com/auth/callback",
  "https://app.printflex.mpctrades.com/auth/session-token"
]

[build]
# Production is never the target of `shopify app dev`, so the CLI must never rewrite these URLs.
automatically_update_urls_on_dev = false
