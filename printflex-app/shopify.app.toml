# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

name = "PrintFlex"
handle = "printflex"
embedded = true
client_id = "34363db3a11f246c64f2b24864846aea"
application_url = "https://dev.printflex.mpctrades.com"

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_orders,write_orders,write_products,write_metaobjects,write_metaobject_definitions"

[webhooks]
api_version = "2026-10"

  [[webhooks.subscriptions]]
  topics = [ "app/uninstalled" ]
  uri = "/webhooks/app/uninstalled"

  [[webhooks.subscriptions]]
  topics = [ "app/scopes_update" ]
  uri = "/webhooks/app/scopes_update"

  [[webhooks.subscriptions]]
  topics = [ "orders/create", "orders/updated", "orders/fulfilled", "orders/cancelled" ]
  uri = "/webhooks/orders"

  [[webhooks.subscriptions]]
  compliance_topics = [ "customers/data_request", "customers/redact", "shop/redact" ]
  uri = "/webhooks/compliance"

[auth]
redirect_urls = [
  "https://dev.printflex.mpctrades.com/auth/callback",
  "https://dev.printflex.mpctrades.com/auth/session-token"
]

[build]
# Off, so a local `shopify app dev` does not overwrite the dev server URL above. Pass --tunnel-url or
# answer "no" when the CLI offers to update URLs.
automatically_update_urls_on_dev = false
