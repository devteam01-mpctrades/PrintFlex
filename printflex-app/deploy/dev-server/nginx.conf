# /etc/nginx/sites-available/dev.printflex.mpctrades.com
# certbot adds the TLS block when you run: sudo certbot --nginx -d dev.printflex.mpctrades.com
server {
    listen 80;
    listen [::]:80;
    server_name dev.printflex.mpctrades.com;

    # Logo uploads arrive as data URLs inside the template form.
    client_max_body_size 5m;

    location / {
        proxy_pass http://127.0.0.1:3011;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
    }
}
